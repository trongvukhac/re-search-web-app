<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="100%" height="100%">
  <defs>
    
    <filter id="royalShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="auraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  
    <linearGradient id="sakuraRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="30%" stop-color="#ff99bb"/>
      <stop offset="70%" stop-color="#f05b88"/>
      <stop offset="100%" stop-color="#b82d54"/>
    </linearGradient>
    <linearGradient id="sakuraBranch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb8cf"/>
      <stop offset="40%" stop-color="#e86b8b"/>
      <stop offset="80%" stop-color="#8c4355"/>
      <stop offset="100%" stop-color="#542531"/>
    </linearGradient>
    <radialGradient id="petalPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffb8cf"/>
      <stop offset="85%" stop-color="#f06292"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="356" height="756" rx="24" fill="none" stroke="url(#sakuraRibbon)" stroke-width="3.5" filter="url(#royalShadow)"/>
  <rect x="5.5" y="5.5" width="349" height="749" rx="21" fill="none" stroke="rgba(255, 184, 207, 0.45)" stroke-width="2"/>
  <rect x="8.5" y="8.5" width="343" height="743" rx="18" fill="none" stroke="url(#sakuraBranch)" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Top-Left Sakura Branches -->
  <g transform="translate(18, 18)" filter="url(#royalShadow)">
    <path d="M0,45 Q15,20 40,8 Q60,0 85,5" fill="none" stroke="url(#sakuraBranch)" stroke-width="2.5" stroke-linecap="round"/>
    <g transform="translate(20, 18)">
    <g>
      <circle cx="7.0" cy="0.0" r="5.5" fill="url(#petalPink)"/>
      <circle cx="2.2" cy="6.7" r="5.5" fill="url(#petalPink)"/>
      <circle cx="-5.7" cy="4.1" r="5.5" fill="url(#petalPink)"/>
      <circle cx="-5.7" cy="-4.1" r="5.5" fill="url(#petalPink)"/>
      <circle cx="2.2" cy="-6.7" r="5.5" fill="url(#petalPink)"/>
      <circle cx="0" cy="0" r="3.5" fill="#fffdfa"/>
      <circle cx="0" cy="0" r="2.0" fill="#ffd54f"/>
    </g>
  </g>
    <g transform="translate(50, 10)">
    <g>
      <circle cx="5.6" cy="0.0" r="4.4" fill="url(#petalPink)"/>
      <circle cx="1.7" cy="5.3" r="4.4" fill="url(#petalPink)"/>
      <circle cx="-4.5" cy="3.3" r="4.4" fill="url(#petalPink)"/>
      <circle cx="-4.5" cy="-3.3" r="4.4" fill="url(#petalPink)"/>
      <circle cx="1.7" cy="-5.3" r="4.4" fill="url(#petalPink)"/>
      <circle cx="0" cy="0" r="2.8" fill="#fffdfa"/>
      <circle cx="0" cy="0" r="1.6" fill="#ffd54f"/>
    </g>
  </g>
    <circle cx="75" cy="8" r="3.5" fill="url(#petalPink)"/>
    <path d="M35,35 Q40,30 45,34 Q40,40 35,35 Z" fill="url(#petalPink)"/>
    <path d="M65,25 Q70,20 73,26 Q68,30 65,25 Z" fill="url(#petalPink)"/>
  </g>

  <!-- Top-Right Slender Corner -->
  <g transform="translate(346, 14)">
    <path d="M-25,0 C-10,3 -3,10 0,25" fill="none" stroke="url(#sakuraRibbon)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-8" cy="8" r="2" fill="#ffb8cf"/>
  </g>

  <!-- Avatar Garland -->
  <g transform="translate(64, 195)" filter="url(#royalShadow)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#sakuraRibbon)" stroke-width="2.6"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="rgba(255, 184, 207, 0.5)" stroke-width="1" stroke-dasharray="3 3"/>
    <g transform="translate(44, 0)">
    <g>
      <circle cx="4.2" cy="0.0" r="3.3" fill="url(#petalPink)"/>
      <circle cx="1.3" cy="4.0" r="3.3" fill="url(#petalPink)"/>
      <circle cx="-3.4" cy="2.5" r="3.3" fill="url(#petalPink)"/>
      <circle cx="-3.4" cy="-2.5" r="3.3" fill="url(#petalPink)"/>
      <circle cx="1.3" cy="-4.0" r="3.3" fill="url(#petalPink)"/>
      <circle cx="0" cy="0" r="2.1" fill="#fffdfa"/>
      <circle cx="0" cy="0" r="1.2" fill="#ffd54f"/>
    </g>
  </g>
    <g transform="translate(-44, 0)">
    <g>
      <circle cx="4.2" cy="0.0" r="3.3" fill="url(#petalPink)"/>
      <circle cx="1.3" cy="4.0" r="3.3" fill="url(#petalPink)"/>
      <circle cx="-3.4" cy="2.5" r="3.3" fill="url(#petalPink)"/>
      <circle cx="-3.4" cy="-2.5" r="3.3" fill="url(#petalPink)"/>
      <circle cx="1.3" cy="-4.0" r="3.3" fill="url(#petalPink)"/>
      <circle cx="0" cy="0" r="2.1" fill="#fffdfa"/>
      <circle cx="0" cy="0" r="1.2" fill="#ffd54f"/>
    </g>
  </g>
  </g>

  <!-- Bottom Corners -->
  <g transform="translate(14, 746)" filter="url(#royalShadow)">
    <path d="M0,-35 C15,-25 35,-12 65,-6 C40,-3 18,-2 0,0 Z" fill="url(#sakuraRibbon)" stroke="url(#sakuraBranch)" stroke-width="1.2"/>
    <g transform="translate(24, -20)">
      
    <g>
      <circle cx="9.8" cy="0.0" r="7.7" fill="url(#petalPink)"/>
      <circle cx="3.0" cy="9.3" r="7.7" fill="url(#petalPink)"/>
      <circle cx="-7.9" cy="5.8" r="7.7" fill="url(#petalPink)"/>
      <circle cx="-7.9" cy="-5.8" r="7.7" fill="url(#petalPink)"/>
      <circle cx="3.0" cy="-9.3" r="7.7" fill="url(#petalPink)"/>
      <circle cx="0" cy="0" r="4.9" fill="#fffdfa"/>
      <circle cx="0" cy="0" r="2.8" fill="#ffd54f"/>
    </g>
  
      <g transform="translate(18, 10)">
    <g>
      <circle cx="5.6" cy="0.0" r="4.4" fill="url(#petalPink)"/>
      <circle cx="1.7" cy="5.3" r="4.4" fill="url(#petalPink)"/>
      <circle cx="-4.5" cy="3.3" r="4.4" fill="url(#petalPink)"/>
      <circle cx="-4.5" cy="-3.3" r="4.4" fill="url(#petalPink)"/>
      <circle cx="1.7" cy="-5.3" r="4.4" fill="url(#petalPink)"/>
      <circle cx="0" cy="0" r="2.8" fill="#fffdfa"/>
      <circle cx="0" cy="0" r="1.6" fill="#ffd54f"/>
    </g>
  </g>
    </g>
  </g>

  <g transform="translate(346, 746)" filter="url(#royalShadow)">
    <path d="M0,-35 C-15,-25 -35,-12 -65,-6 C-40,-3 -18,-2 0,0 Z" fill="url(#sakuraRibbon)" stroke="url(#sakuraBranch)" stroke-width="1.2"/>
    <g transform="translate(-20, -16)">
    <g>
      <circle cx="6.3" cy="0.0" r="5.0" fill="url(#petalPink)"/>
      <circle cx="1.9" cy="6.0" r="5.0" fill="url(#petalPink)"/>
      <circle cx="-5.1" cy="3.7" r="5.0" fill="url(#petalPink)"/>
      <circle cx="-5.1" cy="-3.7" r="5.0" fill="url(#petalPink)"/>
      <circle cx="1.9" cy="-6.0" r="5.0" fill="url(#petalPink)"/>
      <circle cx="0" cy="0" r="3.1" fill="#fffdfa"/>
      <circle cx="0" cy="0" r="1.8" fill="#ffd54f"/>
    </g>
  </g>
  </g>

  <g transform="translate(180, 752)" filter="url(#royalShadow)">
    <path d="M-50,0 Q0,4 50,0" fill="none" stroke="url(#sakuraRibbon)" stroke-width="1.8"/>
    <circle cx="0" cy="2" r="3.5" fill="url(#petalPink)"/>
    <circle cx="-25" cy="1" r="2" fill="#ffb8cf"/>
    <circle cx="25" cy="1" r="2" fill="#ffb8cf"/>
  </g>
</svg>