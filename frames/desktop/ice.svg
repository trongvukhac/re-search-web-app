<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" width="100%" height="100%">
  <defs>
    
    <filter id="royalShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="auraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  
    <linearGradient id="iceBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#b2ebf2"/>
      <stop offset="70%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#00838f"/>
    </linearGradient>
    <linearGradient id="crystalFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </linearGradient>
    <radialGradient id="iceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#b2ebf2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00bcd4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="676" height="756" rx="24" fill="none" stroke="url(#iceBorder)" stroke-width="3.5" filter="url(#royalShadow)"/>
  <rect x="5.5" y="5.5" width="669" height="749" rx="21" fill="none" stroke="rgba(224, 247, 250, 0.6)" stroke-width="2"/>
  <rect x="8.5" y="8.5" width="663" height="743" rx="18" fill="none" stroke="url(#iceBorder)" stroke-width="1.2" stroke-dasharray="7 4"/>

  <!-- Top-Left Ice Crystals -->
  <g transform="translate(18, 18)" filter="url(#royalShadow)">
    <polygon points="0,40 8,15 25,25 15,48" fill="url(#crystalFacet)" stroke="#ffffff" stroke-width="0.8"/>
    <polygon points="12,18 28,-2 38,12 22,30" fill="url(#crystalFacet)" stroke="#ffffff" stroke-width="0.8"/>
    <polygon points="28,2 45,-8 52,4 35,14" fill="url(#crystalFacet)" stroke="#ffffff" stroke-width="0.8"/>
    <g transform="translate(42, 28)">
    <g>
      <circle cx="0" cy="0" r="10" fill="url(#iceGlow)"/>
      <line x1="0" y1="0" x2="10.0" y2="0.0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="5.0" y2="8.7" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-5.0" y2="8.7" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-10.0" y2="0.0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-5.0" y2="-8.7" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="5.0" y2="-8.7" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="3.0" fill="#ffffff"/>
    </g>
  </g>
  </g>

  <!-- Top-Right Slender Bracket -->
  <g transform="translate(666, 14)">
    <path d="M-25,0 C-10,3 -3,10 0,25" fill="none" stroke="url(#iceBorder)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-8" cy="8" r="1.8" fill="#e0f7fa"/>
  </g>

  <!-- Avatar Halo -->
  <g transform="translate(77, 200)" filter="url(#royalShadow)">
    <circle cx="0" cy="0" r="49" fill="none" stroke="url(#iceBorder)" stroke-width="2.6"/>
    <circle cx="0" cy="0" r="53" fill="none" stroke="rgba(178, 235, 242, 0.65)" stroke-width="1.2" stroke-dasharray="4 4"/>
    <g transform="translate(51, 0)">
    <g>
      <circle cx="0" cy="0" r="5" fill="url(#iceGlow)"/>
      <line x1="0" y1="0" x2="5.0" y2="0.0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="2.5" y2="4.3" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-2.5" y2="4.3" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-5.0" y2="0.0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-2.5" y2="-4.3" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="2.5" y2="-4.3" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>
  </g>
    <g transform="translate(-51, 0)">
    <g>
      <circle cx="0" cy="0" r="5" fill="url(#iceGlow)"/>
      <line x1="0" y1="0" x2="5.0" y2="0.0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="2.5" y2="4.3" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-2.5" y2="4.3" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-5.0" y2="0.0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-2.5" y2="-4.3" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="2.5" y2="-4.3" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>
  </g>
  </g>

  <!-- Bottom Corners -->
  <g transform="translate(14, 746)" filter="url(#royalShadow)">
    <polygon points="0,-40 12,-15 35,-20 18,-4" fill="url(#crystalFacet)" stroke="#ffffff" stroke-width="0.8"/>
    <polygon points="16,-22 36,-38 48,-18 28,-8" fill="url(#crystalFacet)" stroke="#ffffff" stroke-width="0.8"/>
    <g transform="translate(26, -18)">
    <g>
      <circle cx="0" cy="0" r="14" fill="url(#iceGlow)"/>
      <line x1="0" y1="0" x2="14.0" y2="0.0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="7.0" y2="12.1" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-7.0" y2="12.1" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-14.0" y2="0.0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-7.0" y2="-12.1" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="7.0" y2="-12.1" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="4.2" fill="#ffffff"/>
    </g>
  </g>
  </g>

  <g transform="translate(666, 746)" filter="url(#royalShadow)">
    <polygon points="0,-35 -12,-15 -35,-20 -18,-4" fill="url(#crystalFacet)" stroke="#ffffff" stroke-width="0.8"/>
    <g transform="translate(-20, -16)">
    <g>
      <circle cx="0" cy="0" r="10" fill="url(#iceGlow)"/>
      <line x1="0" y1="0" x2="10.0" y2="0.0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="5.0" y2="8.7" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-5.0" y2="8.7" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-10.0" y2="0.0" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-5.0" y2="-8.7" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="5.0" y2="-8.7" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="3.0" fill="#ffffff"/>
    </g>
  </g>
  </g>

  <g transform="translate(340, 752)" filter="url(#royalShadow)">
    <path d="M-50,0 L50,0" fill="none" stroke="url(#iceBorder)" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" filter="url(#auraGlow)"/>
    <circle cx="-25" cy="0" r="1.8" fill="#80deea"/>
    <circle cx="25" cy="0" r="1.8" fill="#80deea"/>
  </g>
</svg>