<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="iceGlacial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <radialGradient id="crystalCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0284C7" />
    </radialGradient>
    <filter id="iceGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Viền băng vát góc giác cắt kim cương -->
  <rect x="2.5" y="2.5" width="355" height="755" rx="22" ry="22" stroke="url(#iceGlacial)" stroke-width="2.4" fill="none" />
  <rect x="7" y="7" width="346" height="746" rx="18" ry="18" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="12 4 4 4" fill="none" opacity="0.85" />
  <rect x="12" y="12" width="336" height="736" rx="14" ry="14" stroke="#E0F2FE" stroke-width="0.8" fill="none" opacity="0.6" />

  <!-- Góc Trên Trái: Hoa tuyết fractal 6 cánh đối xứng sắc sảo & gai băng -->
  <g transform="translate(20, 20)" filter="url(#iceGlow)">
    <!-- 6 trục hoa tuyết -->
    <g stroke="url(#iceGlacial)" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="-18" x2="0" y2="18" />
      <line x1="-15.6" y1="-9" x2="15.6" y2="9" />
      <line x1="-15.6" y1="9" x2="15.6" y2="-9" />
      <!-- Nhánh hoa tuyết cấp 2 -->
      <path d="M -4,-12 L 0,-15 L 4,-12" fill="none" />
      <path d="M -4,12 L 0,15 L 4,12" fill="none" />
      <path d="M -12,-4 L -15,0 L -12,4" fill="none" />
      <path d="M 12,-4 L 15,0 L 12,4" fill="none" />
    </g>
    <!-- Trọng tâm viên ngọc băng pha lê -->
    <polygon points="0,-6 5,-2 5,4 0,7 -5,4 -5,-2" fill="url(#crystalCore)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="-1" cy="-1" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Góc Trên Phải: Băng tinh giác vát né nút đóng -->
  <g transform="translate(342, 18)" filter="url(#iceGlow)">
    <polygon points="0,-10 8,-4 6,6 -2,8 -8,2" fill="url(#crystalCore)" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#38BDF8" stroke-width="1.2" />
  </g>

  <!-- Góc Dưới Trái & Phải: Tinh thể băng tuyết lớn nâng đỡ card -->
  <g transform="translate(22, 738)" filter="url(#iceGlow)">
    <g stroke="url(#iceGlacial)" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="-20" x2="0" y2="20" />
      <line x1="-17.3" y1="-10" x2="17.3" y2="10" />
      <line x1="-17.3" y1="10" x2="17.3" y2="-10" />
      <path d="M -5,-14 L 0,-17 L 5,-14" fill="none" />
      <path d="M -5,14 L 0,17 L 5,14" fill="none" />
    </g>
    <polygon points="0,-7 6,-3 6,5 0,8 -6,5 -6,-3" fill="url(#crystalCore)" stroke="#FFFFFF" stroke-width="1.2" />
  </g>

  <g transform="translate(338, 738)" filter="url(#iceGlow)">
    <g stroke="url(#iceGlacial)" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="-20" x2="0" y2="20" />
      <line x1="-17.3" y1="-10" x2="17.3" y2="10" />
      <line x1="-17.3" y1="10" x2="17.3" y2="-10" />
      <path d="M -5,-14 L 0,-17 L 5,-14" fill="none" />
      <path d="M -5,14 L 0,17 L 5,14" fill="none" />
    </g>
    <polygon points="0,-7 6,-3 6,5 0,8 -6,5 -6,-3" fill="url(#crystalCore)" stroke="#FFFFFF" stroke-width="1.2" />
  </g>

  <!-- Hạt tinh thể băng lấp lánh ở mép viền -->
  <g transform="translate(180, 6)">
    <polygon points="0,-5 4,0 0,5 -4,0" fill="#E0F2FE" stroke="#38BDF8" stroke-width="0.8" />
  </g>
  <g transform="translate(180, 754)">
    <polygon points="0,-5 4,0 0,5 -4,0" fill="#E0F2FE" stroke="#38BDF8" stroke-width="0.8" />
  </g>
</svg>