<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="defSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="defGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Viền ngoài cùng bám sát mép card (R=24) -->
  <rect x="2" y="2" width="356" height="756" rx="22" ry="22" stroke="url(#defSilver)" stroke-width="1.8" fill="none" />
  
  <!-- Viền mảnh tinh tế bên trong -->
  <rect x="8" y="8" width="344" height="744" rx="18" ry="18" stroke="url(#defSilver)" stroke-width="1" stroke-dasharray="6 4" fill="none" opacity="0.75" />

  <!-- 4 Góc: Nút thắt học giả Celtic tối giản -->
  <!-- Top-Left -->
  <g transform="translate(10, 10)" filter="url(#defGlow)">
    <path d="M 0,22 L 0,8 C 0,3.6 3.6,0 8,0 L 22,0" stroke="url(#defSilver)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="10" cy="10" r="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
    <polygon points="10,6 14,10 10,14 6,10" fill="#FFFFFF" />
  </g>

  <!-- Top-Right (né nút đóng) -->
  <g transform="translate(350, 10) scale(-1, 1)" filter="url(#defGlow)">
    <path d="M 0,20 L 0,8 C 0,3.6 3.6,0 8,0 L 20,0" stroke="url(#defSilver)" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="8" cy="8" r="2.5" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
  </g>

  <!-- Bottom-Left -->
  <g transform="translate(10, 750) scale(1, -1)" filter="url(#defGlow)">
    <path d="M 0,22 L 0,8 C 0,3.6 3.6,0 8,0 L 22,0" stroke="url(#defSilver)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="10" cy="10" r="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
    <polygon points="10,6 14,10 10,14 6,10" fill="#FFFFFF" />
  </g>

  <!-- Bottom-Right -->
  <g transform="translate(350, 750) scale(-1, -1)" filter="url(#defGlow)">
    <path d="M 0,22 L 0,8 C 0,3.6 3.6,0 8,0 L 22,0" stroke="url(#defSilver)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="10" cy="10" r="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
    <polygon points="10,6 14,10 10,14 6,10" fill="#FFFFFF" />
  </g>

  <!-- Điểm nhấn kim cương ở giữa cạnh trên và dưới -->
  <g transform="translate(180, 5)">
    <polygon points="0,-3 4,0 0,3 -4,0" fill="#CBD5E1" stroke="#94A3B8" stroke-width="0.8" />
  </g>
  <g transform="translate(180, 755)">
    <polygon points="0,-3 4,0 0,3 -4,0" fill="#CBD5E1" stroke="#94A3B8" stroke-width="0.8" />
  </g>
</svg>