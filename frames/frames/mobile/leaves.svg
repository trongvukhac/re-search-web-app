<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="sylvanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="leafGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <radialGradient id="forestOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ECFCCB" />
      <stop offset="40%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#065F46" />
    </radialGradient>
    <filter id="forestGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064E3B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Viền đôi dây leo cổ thụ -->
  <rect x="3" y="3" width="354" height="754" rx="22" ry="22" stroke="url(#sylvanGold)" stroke-width="2.4" fill="none" />
  <rect x="8" y="8" width="344" height="744" rx="17" ry="17" stroke="#059669" stroke-width="1.2" stroke-dasharray="12 4 4 4" fill="none" opacity="0.8" />

  <!-- Góc Trên Trái: Nhánh cổ thụ đan kết, lá nguyệt quế và hạt ngọc rừng -->
  <g transform="translate(6, 6)" filter="url(#forestGlow)">
    <path d="M 0,55 C 2,28 20,8 55,0 C 42,12 36,28 38,42 C 24,34 12,38 0,55 Z" fill="url(#sylvanGold)" />
    <!-- Lá nguyệt quế vàng chanh -->
    <path d="M 12,24 Q 22,14 32,20 Q 24,32 12,24 Z" fill="url(#leafGoldGrad)" />
    <path d="M 24,10 Q 36,2 44,12 Q 34,22 24,10 Z" fill="#86EFAC" />
    <!-- Hạt ngọc tinh linh rừng -->
    <circle cx="22" cy="22" r="5" fill="url(#forestOrb)" stroke="#FEF08A" stroke-width="1.2" />
    <circle cx="20.5" cy="20.5" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Góc Trên Phải: Dây lộc bện né nút đóng -->
  <g transform="translate(354, 6) scale(-1, 1)" filter="url(#forestGlow)">
    <path d="M 0,42 C 2,20 18,4 42,0 C 30,8 26,20 28,30 C 16,24 8,28 0,42 Z" fill="url(#sylvanGold)" />
    <path d="M 10,18 Q 18,10 26,16 Q 18,24 10,18 Z" fill="url(#leafGoldGrad)" />
    <circle cx="18" cy="18" r="3.5" fill="url(#forestOrb)" stroke="#FEF08A" stroke-width="1" />
  </g>

  <!-- Góc Dưới Trái & Phải: Vòng nguyệt quế đại ngàn -->
  <g transform="translate(6, 754) scale(1, -1)" filter="url(#forestGlow)">
    <path d="M 0,60 C 4,32 24,8 60,0 C 46,14 40,34 42,48 C 26,38 14,44 0,60 Z" fill="url(#sylvanGold)" />
    <path d="M 14,28 Q 26,16 38,24 Q 28,38 14,28 Z" fill="url(#leafGoldGrad)" />
    <path d="M 30,12 Q 44,4 52,14 Q 40,26 30,12 Z" fill="#86EFAC" />
    <circle cx="26" cy="26" r="5.5" fill="url(#forestOrb)" stroke="#FEF08A" stroke-width="1.2" />
  </g>

  <g transform="translate(354, 754) scale(-1, -1)" filter="url(#forestGlow)">
    <path d="M 0,60 C 4,32 24,8 60,0 C 46,14 40,34 42,48 C 26,38 14,44 0,60 Z" fill="url(#sylvanGold)" />
    <path d="M 14,28 Q 26,16 38,24 Q 28,38 14,28 Z" fill="url(#leafGoldGrad)" />
    <circle cx="26" cy="26" r="5.5" fill="url(#forestOrb)" stroke="#FEF08A" stroke-width="1.2" />
  </g>

  <!-- Dải lá chạy dọc hai bên cạnh -->
  <g transform="translate(3, 266)">
    <path d="M 0,-10 C 6,-6 8,0 4,6 C 1,2 0,-4 0,-10 Z" fill="#10B981" />
    <path d="M 0,10 C 6,6 8,0 4,-6 C 1,-2 0,4 0,10 Z" fill="#84CC16" />
  </g>
  <g transform="translate(357, 266) scale(-1, 1)">
    <path d="M 0,-10 C 6,-6 8,0 4,6 C 1,2 0,-4 0,-10 Z" fill="#10B981" />
    <path d="M 0,10 C 6,6 8,0 4,-6 C 1,-2 0,4 0,10 Z" fill="#84CC16" />
  </g>
</svg>