<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="40%" stop-color="#34D399" />
      <stop offset="80%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="dewDrop" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#10B981" />
    </radialGradient>
    <filter id="sproutGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Viền ngoài hữu cơ -->
  <rect x="2.5" y="2.5" width="675" height="755" rx="22" ry="22" stroke="url(#sproutGrad)" stroke-width="2" fill="none" />
  <rect x="7" y="7" width="666" height="746" rx="18" ry="18" stroke="#34D399" stroke-width="0.8" stroke-dasharray="10 5" fill="none" opacity="0.6" />

  <!-- Góc Trên Trái: Mầm cây vươn ra với giọt sương mai -->
  <g transform="translate(4, 4)" filter="url(#sproutGlow)">
    <path d="M 2,42 C 4,24 16,10 36,4 C 44,1 52,2 58,5" stroke="url(#sproutGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Lá mầm 1 -->
    <path d="M 12,22 C 12,12 24,10 28,16 C 26,24 18,26 12,22 Z" fill="#34D399" stroke="#059669" stroke-width="0.8" />
    <!-- Lá mầm 2 (lộc non) -->
    <path d="M 28,10 C 34,2 44,4 46,12 C 40,16 32,16 28,10 Z" fill="#6EE7B7" stroke="#059669" stroke-width="0.8" />
    <!-- Giọt sương mai lấp lánh -->
    <circle cx="22" cy="18" r="3.5" fill="url(#dewDrop)" />
    <circle cx="21" cy="17" r="1" fill="#FFFFFF" />
  </g>

  <!-- Góc Trên Phải: Búp non uốn lượn né nút đóng -->
  <g transform="translate(676, 4) scale(-1, 1)" filter="url(#sproutGlow)">
    <path d="M 2,34 C 4,18 14,8 30,3 C 38,1 42,2 46,4" stroke="url(#sproutGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 10,18 C 10,10 18,8 22,14 C 20,20 14,22 10,18 Z" fill="#34D399" stroke="#059669" stroke-width="0.7" />
    <circle cx="16" cy="14" r="2.5" fill="url(#dewDrop)" />
  </g>

  <!-- Góc Dưới Trái & Phải: Dây lộc bám sát viền dưới -->
  <g transform="translate(4, 756) scale(1, -1)" filter="url(#sproutGlow)">
    <path d="M 2,42 C 4,22 18,8 40,2 C 50,0 60,3 66,7" stroke="url(#sproutGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 16,18 C 16,8 28,8 30,16 C 28,24 20,24 16,18 Z" fill="#34D399" stroke="#059669" stroke-width="0.8" />
    <path d="M 34,8 C 42,0 50,4 50,12 C 44,16 36,14 34,8 Z" fill="#6EE7B7" stroke="#059669" stroke-width="0.8" />
    <circle cx="24" cy="14" r="3" fill="url(#dewDrop)" />
  </g>

  <g transform="translate(676, 756) scale(-1, -1)" filter="url(#sproutGlow)">
    <path d="M 2,42 C 4,22 18,8 40,2 C 50,0 60,3 66,7" stroke="url(#sproutGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 16,18 C 16,8 28,8 30,16 C 28,24 20,24 16,18 Z" fill="#34D399" stroke="#059669" stroke-width="0.8" />
    <circle cx="24" cy="14" r="3" fill="url(#dewDrop)" />
  </g>

  <!-- Lộc nhỏ dọc hai bên hông -->
  <g transform="translate(3, 342)">
    <path d="M 0,0 C 6,-6 10,-2 8,6 C 4,6 1,4 0,0 Z" fill="#34D399" stroke="#059669" stroke-width="0.6" />
  </g>
  <g transform="translate(677, 342) scale(-1, 1)">
    <path d="M 0,0 C 6,-6 10,-2 8,6 C 4,6 1,4 0,0 Z" fill="#34D399" stroke="#059669" stroke-width="0.6" />
  </g>
</svg>